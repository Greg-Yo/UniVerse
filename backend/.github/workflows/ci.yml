name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: universe
          POSTGRES_PASSWORD: universe
          POSTGRES_DB: universe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U universe"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Migrations (verif application)
        env:
          DATABASE_URL: postgresql://universe:universe@localhost:5432/universe_test?schema=public
          DIRECT_URL: postgresql://universe:universe@localhost:5432/universe_test?schema=public
          APP_DB_PASSWORD: ci_app_password_strong_1
        run: npx prisma migrate deploy

      - name: Creer role universe_app (RLS e2e)
        env:
          PGPASSWORD: universe
        run: |
          psql -h localhost -U universe -d universe_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'universe_app') THEN
              CREATE ROLE universe_app LOGIN PASSWORD 'ci_app_password_strong_1';
            ELSE
              ALTER ROLE universe_app LOGIN PASSWORD 'ci_app_password_strong_1';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE universe_test TO universe_app;
          GRANT USAGE ON SCHEMA public TO universe_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO universe_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO universe_app;
          REVOKE SELECT ("motDePasseHash", "emailVerificationTokenHash", "emailVerificationExpiresAt") ON TABLE "Utilisateur" FROM universe_app;
          REVOKE UPDATE ("motDePasseHash", "emailVerificationTokenHash", "emailVerificationExpiresAt", "emailVerifie", "email") ON TABLE "Utilisateur" FROM universe_app;
          SQL

      - name: Tests unitaires + securite + RLS e2e
        env:
          RUN_RLS_E2E: 'true'
          DATABASE_URL_APP: postgresql://universe_app:ci_app_password_strong_1@localhost:5432/universe_test?schema=public
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  docker-publish:
    name: Build & Push image
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  deploy:
    name: Deploiement SSH (VPS)
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploiement via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/universe
            docker compose pull
            docker compose up -d
            docker image prune -f
            # Les migrations Prisma s'appliquent au demarrage du conteneur api
            # (cf. Dockerfile CMD : prisma migrate deploy && node dist/main.js).
